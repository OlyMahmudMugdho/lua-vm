
name: Compile Pico W Lua VM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index

      - name: Install Raspberry Pi Pico Core
        run: |
          arduino-cli core install rp2040:rp2040

      - name: Install SD Library
        run: |
          arduino-cli lib install SD

      - name: Prepare Sketch
        run: |
          mkdir -p ./sketch ./artifact
          cp ./sketch.ino ./sketch/sketch.ino

          # Copy the embedded Lua interpreter sources, if present.
          if [ -d ./src ]; then
            cp -r ./src ./sketch/src
          fi

      - name: Compile for Raspberry Pi Pico W
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipicow \
            --output-dir ./artifact \
            ./sketch

          ls -lah ./artifact

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico-w-lua-vm-firmware
          path: ./artifact/**
          if-no-files-found: error
